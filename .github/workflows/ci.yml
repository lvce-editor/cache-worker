name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm test
      - run: npm run type-check
      - run: npm run build
      - run: npm run build:static
      - run: npm run lint
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: ./packages/e2e
        run: npx playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e Chromium
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e Firefox
        working-directory: ./packages/e2e
        run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e WebKit
        if: runner.os == 'Linux'
        working-directory: ./packages/e2e
        run: npm run e2e:headless -- --browser=webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        continue-on-error: true
      - name: Upload Pages artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.tmp/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: checks
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
