name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: ubuntu-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Set package version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --workspace=@lvce-editor/cache-worker --no-git-tag-version
      - run: npm test
      - run: npm run build
      - run: npm publish .tmp/dist --access public --provenance
